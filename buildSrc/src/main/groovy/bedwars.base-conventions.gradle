plugins {
    id 'java-library'
    id 'com.gradleup.shadow'
    id 'io.freefair.lombok'
}

// Global dependencies
dependencies {
    compileOnly 'org.jetbrains:annotations:24.0.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.10.0'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
}

// Global repositories for all subprojects using this convention
repositories {
    mavenCentral()
    mavenLocal()
    maven { url = uri('https://repo.opencollab.dev/repository/maven-public/') }
}

// Tasks configuration
tasks.withType(Javadoc).configureEach {
    // This saves a decent bit of processing power on slow machines
    enabled = false
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Default to Java 17 bytecode to align with modern Paper/Spigot versions and dependent modules
    options.release = 17
    options.compilerArgs += ['-nowarn', '-Xlint:-unchecked', '-Xlint:-deprecation']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
